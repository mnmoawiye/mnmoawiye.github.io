<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Masoud</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="interests.html">Interests</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <!-- Contact Form -->
    <h1>Contact Me</h1>
    <form action="#" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone (XXX-XXX-XXXX):</label>
        <input type="tel" id="phone" name="phone" pattern="\d{3}-\d{3}-\d{4}" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" minlength="10" required></textarea>

        <label for="feedback">Feedback Type:</label>
        <input type="radio" id="question" name="feedback" value="question" required> Question
        <input type="radio" id="comment" name="feedback" value="comment" required> Comment
        <input type="radio" id="suggestion" name="feedback" value="suggestion" required> Suggestion

        <button type="submit">Submit</button>
    </form>

    <footer>
        <p>&copy; 2024 Masoud's Website</p>
    </footer>

</body>
</html>
