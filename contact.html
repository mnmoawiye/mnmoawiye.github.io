<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Masoud</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="interests.html">Interests</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <!-- Contact Form -->
    <main>
        <h1>Contact Me</h1>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="XXX-XXX-XXXX">

            <label for="message">Message:</label>
            <textarea id="message" name="message" minlength="10" required></textarea>

            <fieldset>
                <legend>Reason for Contact:</legend>
                <label><input type="radio" name="reason" value="question"> Question</label>
                <label><input type="radio" name="reason" value="comment"> Comment</label>
                <label><input type="radio" name="reason" value="suggestion"> Suggestion</label>
            </fieldset>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
